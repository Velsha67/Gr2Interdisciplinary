<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  :root{
    --bg1:#0f1220;
    --bg2:#1c2140;
    --panel: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.14);
    --x-color:#5ee0ff;
    --o-color:#ff6f9c;
    --accent:#ffd23f;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1) 70%);
    color:#fff;
    padding: 1.5rem;
  }

  .title{
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight:800;
    letter-spacing:2px;
    margin: 0 0 0.3rem 0;
    text-align:center;
  }
  .title span{ color: var(--x-color); }
  .title span.o{ color: var(--o-color); }

  .subtitle{
    color: rgba(255,255,255,0.55);
    font-size:0.95rem;
    margin-bottom:1.6rem;
    text-align:center;
  }

  .scoreboard{
    display:flex;
    gap:0.8rem;
    margin-bottom:1.6rem;
  }
  .score-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius:14px;
    padding: 0.7rem 1.1rem;
    text-align:center;
    min-width:84px;
  }
  .score-card .label{
    font-size:0.72rem;
    letter-spacing:1px;
    color: rgba(255,255,255,0.5);
    text-transform:uppercase;
  }
  .score-card .value{
    font-size:1.5rem;
    font-weight:800;
    margin-top:2px;
  }
  .score-card.x .value{ color: var(--x-color); }
  .score-card.o .value{ color: var(--o-color); }
  .score-card.draw .value{ color: var(--accent); }

  .status{
    height: 1.6rem;
    margin-bottom: 1rem;
    font-size:1.05rem;
    font-weight:600;
    text-align:center;
  }

  .board{
    position:relative;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    width: min(84vw, 340px);
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
  }

  .cell{
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(2rem, 9vw, 3rem);
    font-weight:800;
    cursor:pointer;
    user-select:none;
    transition: background 0.2s ease, transform 0.15s ease;
    position:relative;
  }
  .cell:hover:not(.filled){
    background: rgba(255,255,255,0.09);
    transform: scale(1.02);
  }
  .cell.x{ color: var(--x-color); text-shadow: 0 0 18px rgba(94,224,255,0.5); }
  .cell.o{ color: var(--o-color); text-shadow: 0 0 18px rgba(255,111,156,0.5); }
  .cell.pop{ animation: pop 0.25s ease; }

  @keyframes pop{
    0%{ transform: scale(0.4); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }

  .cell.win{
    background: rgba(255,210,63,0.18);
    border-color: rgba(255,210,63,0.6);
  }

  .controls{
    margin-top: 1.6rem;
    display:flex;
    gap: 0.8rem;
  }

  button.action{
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--line);
    color:#fff;
    padding: 0.6rem 1.3rem;
    border-radius: 10px;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  button.action:hover{ background: rgba(255,255,255,0.16); transform: translateY(-1px); }
  button.action:active{ transform: translateY(0); }
  button.action.primary{
    background: var(--accent);
    color:#1c1500;
    border-color: var(--accent);
  }
  button.action.primary:hover{ background:#ffdb63; }

  .mode-row{
    display:flex;
    gap:0.6rem;
    margin-bottom:1.4rem;
  }
  .mode-btn{
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    color: rgba(255,255,255,0.7);
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    font-size:0.8rem;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .mode-btn.active{
    background: #fff;
    color:#111;
    font-weight:700;
    border-color:#fff;
  }
</style>
</head>
<body>

  <h1 class="title"><span>X</span> Tic Tac <span class="o">Toe</span></h1>
  <p class="subtitle">Get three in a row to win</p>

  <div class="mode-row">
    <div class="mode-btn active" id="mode2p">2 Players</div>
    <div class="mode-btn" id="modeAI">Vs Computer</div>
  </div>

  <div class="scoreboard">
    <div class="score-card x">
      <div class="label">Player X</div>
      <div class="value" id="scoreX">0</div>
    </div>
    <div class="score-card draw">
      <div class="label">Draws</div>
      <div class="value" id="scoreD">0</div>
    </div>
    <div class="score-card o">
      <div class="label" id="oLabel">Player O</div>
      <div class="value" id="scoreO">0</div>
    </div>
  </div>

  <div class="status" id="status">Player X's turn</div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="action" id="resetScores">Reset Scores</button>
    <button class="action primary" id="newRound">New Round</button>
  </div>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreDEl = document.getElementById('scoreD');
  const oLabelEl = document.getElementById('oLabel');
  const mode2pBtn = document.getElementById('mode2p');
  const modeAIBtn = document.getElementById('modeAI');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let cells = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let vsAI = false;
  let scores = { X: 0, O: 0, draw: 0 };

  function buildBoard(){
    boardEl.innerHTML = '';
    cells.forEach((_, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(cell);
    });
  }

  function handleMove(i){
    if (gameOver || cells[i]) return;
    placeMark(i, currentPlayer);

    const result = checkWinner();
    if (result){
      finishGame(result);
      return;
    }
    if (cells.every(c => c)){
      finishGame({ draw: true });
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    updateStatus();

    if (vsAI && currentPlayer === 'O' && !gameOver){
      setTimeout(aiMove, 400);
    }
  }

  function placeMark(i, player){
    cells[i] = player;
    const cellEl = boardEl.children[i];
    cellEl.textContent = player;
    cellEl.classList.add('filled', player.toLowerCase(), 'pop');
  }

  function checkWinner(){
    for (const line of WIN_LINES){
      const [a,b,c] = line;
      if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]){
        return { winner: cells[a], line };
      }
    }
    return null;
  }

  function finishGame(result){
    gameOver = true;
    if (result.draw){
      scores.draw++;
      statusEl.textContent = "It's a draw!";
    } else {
      scores[result.winner]++;
      result.line.forEach(i => boardEl.children[i].classList.add('win'));
      statusEl.textContent = `Player ${result.winner} wins!`;
    }
    updateScores();
  }

  function updateStatus(){
    if (!gameOver){
      const label = vsAI && currentPlayer === 'O' ? "Computer's turn" : `Player ${currentPlayer}'s turn`;
      statusEl.textContent = label;
    }
  }

  function updateScores(){
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDEl.textContent = scores.draw;
  }

  function newRound(){
    cells = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    buildBoard();
    updateStatus();
  }

  function resetScores(){
    scores = { X: 0, O: 0, draw: 0 };
    updateScores();
    newRound();
  }

  /* --- simple AI: win if possible, block if needed, else center/corner/random --- */
  function aiMove(){
    if (gameOver) return;
    let move = findWinningMove('O') ?? findWinningMove('X') ?? pickStrategic();
    handleMove(move);
  }

  function findWinningMove(player){
    for (const line of WIN_LINES){
      const values = line.map(i => cells[i]);
      const emptyIndex = line[values.indexOf(null)];
      if (values.filter(v => v === player).length === 2 && values.includes(null)){
        return emptyIndex;
      }
    }
    return null;
  }

  function pickStrategic(){
    if (cells[4] === null) return 4;
    const corners = [0,2,6,8].filter(i => cells[i] === null);
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    const empty = cells.map((v,i) => v === null ? i : null).filter(v => v !== null);
    return empty[Math.floor(Math.random() * empty.length)];
  }

  mode2pBtn.addEventListener('click', () => {
    vsAI = false;
    mode2pBtn.classList.add('active');
    modeAIBtn.classList.remove('active');
    oLabelEl.textContent = 'Player O';
    resetScores();
  });
  modeAIBtn.addEventListener('click', () => {
    vsAI = true;
    modeAIBtn.classList.add('active');
    mode2pBtn.classList.remove('active');
    oLabelEl.textContent = 'Computer';
    resetScores();
  });

  document.getElementById('newRound').addEventListener('click', newRound);
  document.getElementById('resetScores').addEventListener('click', resetScores);

  buildBoard();
  updateStatus();
</script>
