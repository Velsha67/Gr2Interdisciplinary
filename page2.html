        <!-- BACK BUTTON -->
        <button class="arrow back" onclick="previousSlide()">
            ❮
        </button>


        <!-- NEXT BUTTON -->
        <button class="arrow next" onclick="nextSlide()">
            ❯
        </button>

    </div>


    <script>

        let currentSlide = 2;

        const cards = document.querySelectorAll(".card");


        function updateCarousel() {

            cards.forEach((card, index) => {

                card.className = "card";

                let position =
                    (index - currentSlide + cards.length)
                    % cards.length;


                /*
                    CENTER
                */
                if (position === 0) {
                    card.classList.add("center");
                }


                /*
                    RIGHT
                */
                else if (position === 1) {
                    card.classList.add("right");
                }


                /*
                    LEFT
                */
                else if (position === cards.length - 1) {
                    card.classList.add("left");
                }


                /*
                    HIDDEN CARDS
                */
                else {
                    card.classList.add("hidden");
                }

            });

        }


        function nextSlide() {

            currentSlide++;

            if (currentSlide >= cards.length) {
                currentSlide = 0;
            }

            updateCarousel();

        }


        function previousSlide() {

            currentSlide--;

            if (currentSlide < 0) {
                currentSlide = cards.length - 1;
            }

            updateCarousel();

        }


        updateCarousel();

    </script>
